<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>프라이스픽 데모 계정 관리</title>
<link rel="icon" href="/cms/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/cms/apple-touch-icon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* CMS 데모와 같은 토큰·규격을 그대로 쓴다 (cms/index.html) */
:root{
  --main:#845EEE; --main-dark:#6C4AB6; --main-hover:#6C4AB6;
  --main-soft:rgba(132,94,238,.08); --main-line:rgba(132,94,238,.22);
  --bg:#F4F1FB; --surface:#FFFFFF; --surface-2:#F8F7FC; --border:#E4DFF0;
  --text:#1A1130; --text-2:#5A5370; --text-3:#9B93B0;
  --success:#16A34A; --success-soft:rgba(22,163,74,.1);
  --danger:#DC2626; --danger-soft:rgba(220,38,38,.1);
  --warning:#D97706; --warning-soft:rgba(217,119,6,.1);
  --r-sm:6px; --r-md:10px; --r-lg:14px; --r-xl:18px;
  --shadow-sm:0 1px 3px rgba(0,0,0,.08); --shadow-lg:0 12px 36px rgba(0,0,0,.14);
  --font:'Pretendard Variable','Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',system-ui,sans-serif;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);
  -webkit-text-size-adjust:100%;}
.wrap{max-width:1000px;margin:0 auto;padding:22px 16px 60px;}
.pg-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px;}
.pg-title{font-size:19px;font-weight:800;letter-spacing:-.3px;}
.pg-sub{font-size:12px;color:var(--text-2);margin-top:3px;}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;margin-bottom:16px;}
.card-header{padding:15px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
.card-title{font-size:14px;font-weight:700;}

table{width:100%;border-collapse:collapse;}
th{text-align:center;padding:10px 14px;font-size:11px;color:var(--text-2);font-weight:600;
  text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--border);
  background:var(--surface-2);white-space:nowrap;position:relative;}
th:not(:last-child)::after{content:"";position:absolute;right:0;top:30%;height:40%;width:1px;background:rgba(0,0,0,.13);}
td{padding:12px 14px;font-size:13px;border-bottom:1px solid var(--border);white-space:nowrap;
  font-variant-numeric:tabular-nums;text-align:center;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:var(--surface-2);}

.btn{padding:7px 14px;border-radius:var(--r-md);font-size:12px;font-weight:600;cursor:pointer;border:none;
  transition:all .15s;font-family:var(--font);white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:5px;}
.btn-primary{background:var(--main);color:#fff;}
.btn-primary:hover{background:var(--main-dark);}
.btn-ghost{background:transparent;color:var(--text-2);border:1px solid var(--border);}
.btn-ghost:hover{color:var(--text);border-color:var(--text-2);}
.btn-danger{background:var(--danger-soft);color:var(--danger);}
.btn-sm{padding:5px 10px;font-size:11px;border-radius:var(--r-sm);}
.btn[disabled]{opacity:.4;cursor:not-allowed;}

.warn-box{background:var(--danger-soft);border:1px solid rgba(239,68,68,.28);border-radius:var(--r-md);
  padding:12px 16px;font-size:12px;color:var(--text-2);margin-bottom:14px;line-height:1.6;display:none;}
.warn-box strong{color:var(--danger);}
.warn-box code{background:rgba(0,0,0,.05);padding:1px 5px;border-radius:4px;font-size:11px;}

/* 계정 ID 칩 — 앱 마이 화면의 ID 복사 방식(짧게 보여주고 전체를 복사)과 같다 */
.uid-chip{display:inline-flex;align-items:center;gap:6px;max-width:100%;
  background:var(--main-soft);border:1px solid var(--main-line);color:var(--main-hover);
  border-radius:99px;padding:5px 11px;font-size:12px;font-weight:700;cursor:pointer;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;transition:all .15s;
  white-space:nowrap;}
.uid-chip:hover{background:rgba(132,94,238,.16);}
.uid-chip:active{transform:scale(.97);}
.uid-chip .ico{width:12px;height:12px;flex-shrink:0;}
.uid-none{color:var(--text-3);font-size:12px;}

/* 닉네임 + 계정 ID를 한 칸에 위아래로 — 칸을 더 늘리면 가로가 좁아진다 */
/* 닉네임·카카오는 계정 ID로 회원 데이터에서 읽어 보여주는 값이다(입력 칸 아님) */
.nick-txt{font-size:12px;font-weight:600;color:var(--text);}
.nick-none{font-size:12px;color:var(--text-3);}
/* 못 쓰는 계정은 계정 ID 옆에 딱지로 붙인다 — 닉네임 칸은 값을 넣는 자리지 설명하는 자리가 아니다 */
.tag{display:inline-block;white-space:nowrap;padding:2px 7px;border-radius:99px;font-size:10px;font-weight:700;margin-left:6px;vertical-align:middle;}
.tag-bad{background:var(--danger-soft);color:var(--danger);}
.tag-warn{background:var(--warning-soft);color:var(--warning);}
.row-dim .uid-chip{opacity:.55;}
.kk{display:inline-block;white-space:nowrap;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600;}
.kk-on{background:var(--main-soft);color:var(--main-hover);}
.kk-off{background:var(--warning-soft);color:var(--warning);}
.lookup-hint{font-size:11px;color:var(--text-2);margin-top:6px;line-height:1.5;min-height:16px;}
.lookup-hint b{color:var(--main-hover);}
.lookup-hint.bad{color:var(--danger);}

/* 같은 사람의 계정 행들은 이름 칸을 rowspan으로 합쳐 붙인다 */
.nm-cell{font-weight:700;vertical-align:middle;background:var(--surface-2);}
.nm-sub{display:block;font-size:11px;font-weight:600;color:var(--text-3);margin-top:3px;}

.modal-overlay{display:none;position:fixed;inset:0;background:rgba(26,17,48,.35);z-index:200;
  align-items:center;justify-content:center;backdrop-filter:blur(2px);padding:14px;}
.modal-overlay.open{display:flex;}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-xl);
  width:480px;max-width:100%;max-height:88vh;overflow-y:auto;box-shadow:var(--shadow-lg);}
.modal-header{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;
  justify-content:space-between;position:sticky;top:0;background:var(--surface);z-index:1;}
.modal-title{font-size:15px;font-weight:700;letter-spacing:-.2px;}
.modal-close{cursor:pointer;background:transparent;border:none;color:var(--text-2);
  width:30px;height:30px;border-radius:var(--r-md);display:flex;align-items:center;justify-content:center;}
.modal-close:hover{color:var(--text);background:var(--surface-2);}
.modal-body{padding:20px 22px;}
.modal-footer{padding:14px 22px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end;}
.form-group{margin-bottom:14px;}
.form-label{font-size:11px;font-weight:700;color:var(--text-2);margin-bottom:5px;display:block;
  text-transform:uppercase;letter-spacing:.4px;}
.form-input{width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-md);
  padding:10px 13px;color:var(--text);font-size:13px;outline:none;font-family:var(--font);transition:border-color .15s;}
.form-input:focus{border-color:var(--main);}
.form-input.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;}
textarea.form-input{resize:vertical;min-height:64px;}
.form-err{display:none;background:var(--danger-soft);color:var(--danger);border-radius:var(--r-md);
  padding:9px 12px;font-size:12px;font-weight:600;margin-bottom:12px;}

/* 사용자 칸 — 골라 넣기와 쳐 넣기 겸용. datalist는 브라우저마다 안 열려서 직접 만든다. */
.pick-wrap{position:relative;}
.pick-wrap .form-input{padding-right:40px;}
.pick-btn{position:absolute;right:5px;top:5px;width:28px;height:28px;border:none;background:transparent;
  color:var(--text-2);cursor:pointer;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;}
.pick-btn:hover{background:var(--main-soft);color:var(--main);}
.pick-btn svg{width:14px;height:14px;transition:transform .15s;}
.pick-wrap.open .pick-btn svg{transform:rotate(180deg);}
.pick-list{display:none;position:absolute;left:0;right:0;top:calc(100% + 5px);z-index:6;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);
  box-shadow:var(--shadow-lg);max-height:196px;overflow-y:auto;padding:4px;}
.pick-wrap.open .pick-list{display:block;}
.pick-head{padding:7px 10px 5px;font-size:10px;font-weight:700;color:var(--text-3);
  text-transform:uppercase;letter-spacing:.4px;}
.pick-item{padding:9px 11px;font-size:13px;font-weight:600;color:var(--text);cursor:pointer;
  border-radius:var(--r-sm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pick-item:hover{background:var(--main-soft);color:var(--main-hover);}
.pick-empty{padding:10px 11px;font-size:12px;color:var(--text-3);}

#toast-el{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(12px);
  background:#1A1130;color:#fff;padding:10px 18px;border-radius:99px;font-size:13px;font-weight:600;
  opacity:0;pointer-events:none;transition:all .2s;z-index:400;white-space:nowrap;max-width:90vw;}
#toast-el.show{opacity:1;transform:translateX(-50%);}

.empty{text-align:center;padding:38px 18px;color:var(--text-3);font-size:13px;}

/* 한/베 토글 — CMS(#ip-lang-toggle)와 같은 규격을 그대로 쓴다 */
#ip-lang-toggle{display:inline-flex;align-items:center;gap:0;background:#ffffff;border:1px solid #E3E0EC;border-radius:999px;padding:3px;cursor:pointer;font-family:inherit;box-shadow:0 2px 10px rgba(90,60,150,0.12);}
#ip-lang-toggle span{font-size:12px;font-weight:700;letter-spacing:.4px;color:#9890ad;padding:3px 12px;border-radius:999px;line-height:1.4;transition:background .15s,color .15s;}
#ip-lang-toggle span.on{background:#845EEE;color:#fff;}
#ip-lang-toggle:hover{border-color:#845EEE;}
.pg-acts{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}

/* ── 375px — 표를 카드 줄로 접는다 ── */
.rowcards{display:none;}
@media (max-width:640px){
  .wrap{padding:16px 12px 56px;}
  .tablewrap{display:none;}
  .rowcards{display:block;}
  .rc{padding:14px 16px;border-bottom:1px solid var(--border);}
  .rc:last-child{border-bottom:none;}
  .rc-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;}
  .rc-name{font-size:14px;font-weight:700;letter-spacing:-.2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .rc-acts{display:flex;gap:6px;flex-shrink:0;}
  .rc-line{display:flex;align-items:center;gap:8px;margin-bottom:7px;min-width:0;}
  .rc-line .uid-chip{min-width:0;white-space:normal;word-break:break-all;text-align:left;border-radius:12px;}
  .rc-acc{border-top:1px dashed var(--border);margin-top:11px;padding-top:11px;}
  .rc-acc:first-of-type{border-top:none;margin-top:0;padding-top:0;}
  .rc-acc-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;}
  .rc-nick{font-size:12px;font-weight:700;color:var(--text-2);letter-spacing:-.2px;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .rc-memo{font-size:12px;color:var(--text-2);line-height:1.5;margin-top:8px;white-space:pre-wrap;word-break:break-word;}
}
</style>
</head>
<body>

<div class="wrap">
  <div class="pg-head">
    <div>
      <div class="pg-title">프라이스픽 데모 계정 관리</div>
      <div class="pg-sub">데모에서 앱을 테스트할 때 가상 데이터를 어느 계정에 넣을지 여기서 확인합니다.</div>
    </div>
    <div class="pg-acts">
      <button id="ip-lang-toggle" data-lang="ko" type="button" title="KO / VI" aria-label="KO/VI"><span data-l="ko" class="on">KO</span><span data-l="vi">VI</span></button>
      <button class="btn btn-primary" id="btn-add">+ 계정 추가</button>
    </div>
  </div>

  <div class="warn-box" id="rule-warn">
    <strong>저장이 막혀 있습니다.</strong> Firestore 규칙에 <code>demo_accounts</code> 공개 규칙이 아직 게시되지 않았습니다.
    저장소의 <code>firestore.rules</code>에 규칙은 들어가 있으니, Firebase 콘솔 → Firestore Database → 규칙에서 한 번 게시하면 바로 열립니다.
  </div>

  <div class="card">
    <div class="card-header">
      <div class="card-title">계정 명부</div>
      <span style="font-size:12px;color:var(--text-2)" id="cnt">—</span>
    </div>

    <div class="tablewrap">
      <table>
        <thead>
          <tr><th style="width:120px">사용자</th><th style="width:130px">닉네임</th><th>계정 ID</th><th style="width:78px">카카오</th><th style="width:130px">메모</th><th style="width:62px">수정</th><th style="width:62px">삭제</th></tr>
        </thead>
        <tbody id="tbody"><tr><td colspan="7" class="empty">불러오는 중…</td></tr></tbody>
      </table>
    </div>

    <div class="rowcards" id="rowcards"><div class="empty">불러오는 중…</div></div>
  </div>
</div>

<!-- 추가 · 수정 모달 -->
<div class="modal-overlay" id="m-acc">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="m-acc-title">계정 추가</div>
      <button class="modal-close" id="m-acc-x" aria-label="닫기">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="form-err" id="m-acc-err"></div>
      <input type="hidden" id="f-id">
      <div class="form-group">
        <label class="form-label" for="f-name">사용자 *</label>
        <div class="pick-wrap" id="f-name-wrap">
          <input class="form-input" id="f-name" type="text" placeholder="고르거나 새로 적으세요" autocomplete="off">
          <button type="button" class="pick-btn" id="f-name-pick" aria-label="등록된 사용자 고르기" title="등록된 사용자 고르기">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <div class="pick-list" id="f-name-list"></div>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label" for="f-acc">계정 ID *</label>
        <input class="form-input mono" id="f-acc" type="text" placeholder="앱 마이 화면에서 복사한 ID" autocomplete="off" spellcheck="false">
        <div class="lookup-hint" id="f-acc-hint"></div>
      </div>
      <div class="form-group" style="margin-bottom:0">
        <label class="form-label" for="f-memo">메모</label>
        <textarea class="form-input" id="f-memo" placeholder="비워 둬도 됩니다"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" id="m-acc-cancel">취소</button>
      <button class="btn btn-primary" id="m-acc-save">저장</button>
    </div>
  </div>
</div>

<!-- 삭제 확인 모달 -->
<div class="modal-overlay" id="m-del">
  <div class="modal" style="width:400px">
    <div class="modal-header">
      <div class="modal-title">계정 삭제</div>
      <button class="modal-close" id="m-del-x" aria-label="닫기">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body" style="font-size:13px;color:var(--text-2);line-height:1.6">
      <span id="m-del-name" style="font-weight:700;color:var(--text)"></span> 줄을 지웁니다. 되돌릴 수 없습니다.
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" id="m-del-cancel">취소</button>
      <button class="btn btn-danger" id="m-del-ok">삭제</button>
    </div>
  </div>
</div>

<div id="toast-el"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
'use strict';

/* 프픽 데모와 같은 Firestore를 쓴다. 컬렉션은 demo_accounts 하나뿐이고,
   그 컬렉션만 로그인 없이 읽고 쓰도록 규칙을 열었다(firestore.rules 참고).
   보안이 필요 없는 명부라 공개로 둔다 — 김반장 확정. */
firebase.initializeApp({
  apiKey: "AIzaSyCElUPJAitnMZxttVYjboV0j4s_qpErAgA",
  authDomain: "pricepick-demo.firebaseapp.com",
  projectId: "pricepick-demo",
  storageBucket: "pricepick-demo.firebasestorage.app",
  messagingSenderId: "505137396208",
  appId: "1:505137396208:web:cea9d208c7745854e14535"
});
var db = firebase.firestore();
var FS = firebase.firestore;
var COL = 'demo_accounts';
var ROWS = [];

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function toast(msg) {
  var t = document.getElementById('toast-el');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function () { t.classList.remove('show'); }, 2400);
}
function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

/* 앱 마이 화면의 ID 복사와 같은 방식 — Clipboard API + execCommand 폴백 */
function copyFallback(text) {
  return new Promise(function (resolve, reject) {
    try {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      var ok = document.execCommand('copy');
      document.body.removeChild(ta);
      ok ? resolve() : reject(new Error('copy failed'));
    } catch (e) { reject(e); }
  });
}
function copyText(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(text).catch(function () { return copyFallback(text); });
  }
  return copyFallback(text);
}
/* 계정 ID는 통째로 보여준다 — 칸 폭이 넉넉하고, 잘라 놓으면 어느 계정인지 눈으로 못 가린다. */

var COPY_ICO = '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>';

function uidChip(uid) {
  if (!uid) return '<span class="uid-none">―</span>';
  return '<button type="button" class="uid-chip" data-copy="' + esc(uid) + '" title="눌러서 전체 ID 복사">'
    + '<span>' + esc(uid) + '</span>' + COPY_ICO + '</button>';
}

/* 한 문서 = 계정 하나 = 한 행. 명부가 갖는 값은 이름·계정 ID·메모 셋뿐이다.
   닉네임과 카카오 연동 여부는 여기 저장하지 않는다 — 계정 ID로 회원 정보에서 그때그때 읽는다.
   조회·매칭은 언제나 account_id로 한다. 이름·닉네임으로 하지 않는다. */
function normRow(r) {
  return {
    _id: r._id,
    name: r.name || '',
    account_id: r.account_id || '',
    memo: r.memo || ''
  };
}

/* 계정 ID로 찾은 회원 정보. 그릴 때마다 다시 읽고 여기에만 둔다(명부에 저장하지 않는다). */
var USERS = {};

/* 회원 조회는 로그인한 상태여야 열린다(firestore.rules: users read = isSignedIn).
   앱(/app)이 쓰는 것과 같은 익명 로그인을 그대로 쓴다. */
function ensureSignedIn() {
  var auth = firebase.auth();
  if (auth.currentUser) return Promise.resolve(auth.currentUser);
  return auth.signInAnonymously().then(function (c) { return c.user; });
}

/* CMS 회원 목록의 dmFetchUsersByIds와 같은 방식 — documentId in 청크(10개)로 users를 읽는다. */
function fetchUsersByIds(ids) {
  var list = [];
  (ids || []).forEach(function (x) { if (x && list.indexOf(x) < 0) list.push(x); });
  if (!list.length) return Promise.resolve({});
  return ensureSignedIn().then(function () {
    var chunks = [];
    for (var i = 0; i < list.length; i += 10) chunks.push(list.slice(i, i + 10));
    var map = {};
    return Promise.all(chunks.map(function (chunk) {
      return db.collection('users')
        .where(firebase.firestore.FieldPath.documentId(), 'in', chunk).get()
        .then(function (snap) { snap.forEach(function (d) { map[d.id] = d.data(); }); });
    })).then(function () { return map; });
  });
}

/* 계정 ID 하나로 회원 문서를 한 번 읽고, 닉네임과 카카오를 그 한 문서에서 같이 꺼낸다.
   따로 읽지 않으므로 한쪽만 잡히는 일은 생기지 않는다.

   구분해야 할 상태가 넷이다 — 뭉뚱그리면 「닉네임 없음 + 카카오 연동」처럼 앞뒤 안 맞아
   보이는 줄이 나온다(실제로 그렇게 보인 적이 있다). 갈라 놓되 그 사실은 계정 ID 옆
   딱지로 알리고, 닉네임·카카오 칸은 값이 없으면 그냥 비운다:
     없는 계정   회원 문서가 없다. 닉네임도 카카오도 말할 수 없다 → 둘 다 비운다.
     탈퇴한 계정 앱 탈퇴(performWithdraw)가 nickname·kakao_login_id를 지우고 status를
                 withdrawn으로 바꾼다. 그런데 linked_kakao는 지우지 않아 옛 값이 남는다.
                 그 잔재를 「연동」이라 내보이면 거짓이 되니 카카오도 비운다.
     정지된 계정 status=suspended. 회원 정보는 살아 있으니 카카오는 그대로 보여준다.
     정상        닉네임이 비어 있을 수 있다(가입 중) → 그때도 칸은 「―」로 비운다. */
function userState(uid) {
  var u = USERS[uid];
  if (!u) return { kind: 'missing' };
  var st = u.status || 'active';
  if (st === 'withdrawn') return { kind: 'withdrawn', u: u };
  if (st === 'suspended') return { kind: 'suspended', u: u };
  return { kind: 'ok', u: u };
}
/* 닉네임 칸에는 닉네임만 쓴다. 값이 없으면 메모 칸과 똑같이 「—」로 비운다.
   못 쓰는 계정이라는 사실은 계정 ID 옆 딱지로 알린다 — 닉네임 자리에 설명을 써 두면
   그것만 띄어쓰기가 있어 실제 닉네임처럼 보이다 만다. */
function nickHtml(uid) {
  var s = userState(uid);
  if (s.kind !== 'ok' || !s.u.nickname) return '<span class="uid-none">―</span>';
  return '<span class="nick-txt">' + esc(s.u.nickname) + '</span>';
}
function accTag(uid) {
  var s = userState(uid);
  if (s.kind === 'missing') return '<span class="tag tag-bad">없는 계정</span>';
  if (s.kind === 'withdrawn') return '<span class="tag tag-bad">탈퇴</span>';
  if (s.kind === 'suspended') return '<span class="tag tag-warn">정지</span>';
  return '';
}
function rowDim(uid) {
  var k = userState(uid).kind;
  return (k === 'missing' || k === 'withdrawn') ? ' class="row-dim"' : '';
}
function kakaoHtml(uid) {
  var s = userState(uid);
  if (s.kind === 'missing' || s.kind === 'withdrawn') return '<span class="uid-none">―</span>';
  return s.u.linked_kakao === true
    ? '<span class="kk kk-on">연동</span>'
    : '<span class="kk kk-off">미연동</span>';
}

/* 이름이 같은 계정끼리 묶는다. 순서는 먼저 나온 이름부터 — 넣은 순서가 뒤집히지 않게. */
function groupByName(rows) {
  var order = [], map = {};
  rows.forEach(function (r) {
    var k = r.name;
    if (!map[k]) { map[k] = { name: k, rows: [] }; order.push(k); }
    map[k].rows.push(r);
  });
  return order.map(function (k) { return map[k]; });
}

/* 숫자가 끼어 있는 문구는 사전(전체 일치)으로 못 잡는다 — 지금 언어를 보고 직접 만든다. */
function L(ko, vi) { return (window.ipGetLang && window.ipGetLang() === 'vi') ? vi : ko; }

function memoCell(memo) {
  return '<td style="white-space:normal;text-align:left;color:var(--text-2);font-size:12px;max-width:200px">'
    + (esc(memo) || '<span class="uid-none">―</span>') + '</td>';
}

function render() {
  var tb = document.getElementById('tbody');
  var rc = document.getElementById('rowcards');
  var rows = ROWS.map(normRow);
  var groups = groupByName(rows);
  document.getElementById('cnt').textContent = L(
    '총 ' + rows.length + '개 계정 · ' + groups.length + '명',
    'Tổng ' + rows.length + ' tài khoản · ' + groups.length + ' người');

  if (!rows.length) {
    tb.innerHTML = '<tr><td colspan="7" class="empty">등록된 계정이 없습니다. 「+ 계정 추가」로 넣으세요.</td></tr>';
    rc.innerHTML = '<div class="empty">등록된 계정이 없습니다. 「+ 계정 추가」로 넣으세요.</div>';
    return;
  }

  var html = '';
  groups.forEach(function (g) {
    g.rows.forEach(function (r, i) {
      html += '<tr>'
        + (i === 0
            ? '<td class="nm-cell" rowspan="' + g.rows.length + '">' + esc(g.name)
              + (g.rows.length > 1 ? '<span class="nm-sub">' + L('계정 ' + g.rows.length + '개', g.rows.length + ' tài khoản') + '</span>' : '') + '</td>'
            : '')
        + '<td>' + nickHtml(r.account_id) + '</td>'
        + '<td' + rowDim(r.account_id) + '>' + uidChip(r.account_id) + accTag(r.account_id) + '</td>'
        + '<td>' + kakaoHtml(r.account_id) + '</td>'
        + memoCell(r.memo)
        + '<td><button class="btn btn-ghost btn-sm" data-edit="' + esc(r._id) + '">수정</button></td>'
        + '<td><button class="btn btn-danger btn-sm" data-del="' + esc(r._id) + '">삭제</button></td>'
        + '</tr>';
    });
  });
  tb.innerHTML = html;

  /* 375px — 사람 한 장, 그 안에 계정들 */
  rc.innerHTML = groups.map(function (g) {
    return '<div class="rc">'
      + '<div class="rc-top"><div class="rc-name">' + esc(g.name)
      + (g.rows.length > 1 ? ' <span style="font-size:11px;font-weight:600;color:var(--text-3)">· ' + L('계정 ' + g.rows.length + '개', g.rows.length + ' tài khoản') + '</span>' : '')
      + '</div></div>'
      + g.rows.map(function (r) {
          return '<div class="rc-acc">'
            + '<div class="rc-acc-top"><div class="rc-nick">' + nickHtml(r.account_id) + ' ' + kakaoHtml(r.account_id) + accTag(r.account_id) + '</div>'
            + '<div class="rc-acts">'
            + '<button class="btn btn-ghost btn-sm" data-edit="' + esc(r._id) + '">수정</button>'
            + '<button class="btn btn-danger btn-sm" data-del="' + esc(r._id) + '">삭제</button>'
            + '</div></div>'
            + '<div class="rc-line"' + rowDim(r.account_id) + '>' + uidChip(r.account_id) + '</div>'
            + (r.memo ? '<div class="rc-memo">' + esc(r.memo) + '</div>' : '')
            + '</div>';
        }).join('')
      + '</div>';
  }).join('');
}

function showRuleWarn(on) {
  document.getElementById('rule-warn').style.display = on ? 'block' : 'none';
}

function load() {
  return db.collection(COL).orderBy('created_at', 'asc').get()
    .then(function (snap) {
      ROWS = snap.docs.map(function (d) {
        var x = d.data(); x._id = d.id; return x;
      });
      showRuleWarn(false);
      /* 닉네임·카카오는 저장해 둔 값을 쓰지 않는다 — 그릴 때마다 회원 정보를 새로 읽는다. */
      return fetchUsersByIds(ROWS.map(function (r) { return normRow(r).account_id; }))
        .then(function (map) { USERS = map; })
        .catch(function (e) {
          console.error('회원 조회', e);
          USERS = {};
          toast('회원 정보를 읽지 못했습니다 — 닉네임·카카오 칸이 빕니다.');
        })
        .then(function () { render(); });
    })
    .catch(function (e) {
      console.error('load', e);
      if (e && e.code === 'permission-denied') {
        showRuleWarn(true);
        document.getElementById('tbody').innerHTML = '<tr><td colspan="7" class="empty">규칙이 게시되면 여기에 명부가 뜹니다.</td></tr>';
        document.getElementById('rowcards').innerHTML = '<div class="empty">규칙이 게시되면 여기에 명부가 뜹니다.</div>';
        document.getElementById('cnt').textContent = '—';
      } else {
        toast(L('불러오기 실패: ', 'Tải thất bại: ') + (e.message || e));
      }
    });
}

/* ── 추가 · 수정 ── */
function openAcc(id) {
  var r = id ? ROWS.filter(function (x) { return x._id === id; })[0] : null;
  document.getElementById('m-acc-title').textContent = r ? '계정 수정' : '계정 추가';
  document.getElementById('f-id').value = r ? r._id : '';
  document.getElementById('f-name').value = r ? (r.name || '') : '';
  var nr = r ? normRow(r) : null;
  document.getElementById('f-acc').value = nr ? nr.account_id : '';
  refreshAccHint();
  document.getElementById('f-memo').value = r ? (r.memo || '') : '';
  document.getElementById('m-acc-err').style.display = 'none';
  pickOpen(false);
  openModal('m-acc');
  setTimeout(function () { document.getElementById('f-name').focus(); }, 60);
}

function saveAcc() {
  var id = document.getElementById('f-id').value;
  var name = document.getElementById('f-name').value.trim();
  var acc = document.getElementById('f-acc').value.trim();
  var memo = document.getElementById('f-memo').value.trim();
  var err = document.getElementById('m-acc-err');

  /* 사용자 중복은 막지 않는다 — 같은 사용자로 넣는 것이 그 사람 아래 계정을 늘리는 방법이다. */
  if (!name) { err.textContent = '사용자는 반드시 넣어야 합니다.'; err.style.display = 'block'; return; }
  if (!acc) { err.textContent = '계정 ID는 반드시 넣어야 합니다.'; err.style.display = 'block'; return; }

  var btn = document.getElementById('m-acc-save');
  btn.disabled = true; btn.textContent = '저장 중…';

  var data = { name: name, account_id: acc, memo: memo, updated_at: FS.FieldValue.serverTimestamp() };
  /* 닉네임은 명부에 저장하지 않는다 — 계정 ID로 회원 정보에서 그때그때 읽는 값이라
     적어 두면 앱에서 바뀌었을 때 명부만 옛 값을 붙들고 있게 된다. 예전에 적어 둔 값은 지운다. */
  var legacy = { nickname: FS.FieldValue.delete() };
  var p = id
    ? db.collection(COL).doc(id).update(Object.assign({}, data, legacy))
    : db.collection(COL).add(Object.assign({ created_at: FS.FieldValue.serverTimestamp() }, data));

  p.then(function () {
    closeModal('m-acc');
    toast(id ? '고쳤습니다.' : '넣었습니다.');
    return load();
  }).catch(function (e) {
    console.error('save', e);
    err.textContent = (e && e.code === 'permission-denied')
      ? '저장이 막혀 있습니다 — demo_accounts 규칙이 아직 게시되지 않았습니다.'
      : L('저장 실패: ', 'Lưu thất bại: ') + (e.message || e);
    err.style.display = 'block';
  }).finally(function () {
    btn.disabled = false; btn.textContent = '저장';
  });
}

/* ── 삭제 ── */
var DEL_ID = null;
function openDel(id) {
  var r = ROWS.filter(function (x) { return x._id === id; })[0];
  if (!r) return;
  DEL_ID = id;
  document.getElementById('m-del-name').textContent = r.name || '이 계정';
  openModal('m-del');
}
function doDel() {
  if (!DEL_ID) return;
  var btn = document.getElementById('m-del-ok');
  btn.disabled = true; btn.textContent = '삭제 중…';
  db.collection(COL).doc(DEL_ID).delete().then(function () {
    closeModal('m-del');
    toast('지웠습니다.');
    DEL_ID = null;
    return load();
  }).catch(function (e) {
    console.error('delete', e);
    toast((e && e.code === 'permission-denied') ? '삭제가 막혀 있습니다 — 규칙 게시가 필요합니다.' : L('삭제 실패: ', 'Xóa thất bại: ') + (e.message || e));
  }).finally(function () {
    btn.disabled = false; btn.textContent = '삭제';
  });
}

/* ── 사용자 펼침 목록 ──
   명부에 이미 있는 사용자를 눌러 고르게 한다. 오타로 같은 사람이 두 줄로 갈라지는 것을 막는
   것이 목적이라, 고르는 것과 별개로 새 사용자를 그대로 쳐 넣는 것도 막지 않는다.
   datalist는 브라우저에 따라 열리지 않아 직접 만든다. */
function userNames() {
  var seen = {}, out = [];
  ROWS.map(normRow).forEach(function (r) {
    var nm = (r.name || '').trim();
    if (nm && !seen[nm]) { seen[nm] = 1; out.push(nm); }
  });
  return out.sort(function (a, b) { return a.localeCompare(b, 'ko'); });
}
function pickOpen(on) {
  var w = document.getElementById('f-name-wrap');
  if (!w) return;
  if (on) {
    var names = userNames();
    document.getElementById('f-name-list').innerHTML = names.length
      ? '<div class="pick-head">등록된 사용자</div>' + names.map(function (nm) {
          return '<div class="pick-item" data-pick="' + esc(nm) + '">' + esc(nm) + '</div>';
        }).join('')
      : '<div class="pick-empty">아직 등록된 사용자가 없습니다. 새로 적어 주세요.</div>';
  }
  w.classList.toggle('open', !!on);
}
document.getElementById('f-name-pick').addEventListener('click', function (e) {
  e.stopPropagation();
  pickOpen(!document.getElementById('f-name-wrap').classList.contains('open'));
});
document.getElementById('f-name').addEventListener('focus', function () { pickOpen(true); });
document.getElementById('f-name-list').addEventListener('click', function (e) {
  var it = e.target.closest('[data-pick]');
  if (!it) return;
  e.stopPropagation();
  document.getElementById('f-name').value = it.getAttribute('data-pick');
  pickOpen(false);
});
document.addEventListener('click', function (e) {
  var w = document.getElementById('f-name-wrap');
  if (w && w.classList.contains('open') && !w.contains(e.target)) pickOpen(false);
});

/* ── 계정 ID를 넣는 자리에서 바로 닉네임을 보여준다 ──
   맞는 ID를 넣으셨는지 저장 전에 그 자리에서 아시라고. 읽어 보여줄 뿐 저장하지 않는다. */
var ACC_HINT_SEQ = 0;
function refreshAccHint() {
  var el = document.getElementById('f-acc-hint');
  if (!el) return;
  var uid = document.getElementById('f-acc').value.trim();
  var seq = ++ACC_HINT_SEQ;
  el.className = 'lookup-hint';
  if (!uid) { el.innerHTML = '계정 ID를 넣으면 닉네임과 카카오 연동 여부를 찾아 보여드립니다.'; return; }
  el.innerHTML = '회원 정보를 찾는 중…';
  fetchUsersByIds([uid]).then(function (map) {
    if (seq !== ACC_HINT_SEQ) return;   // 그 사이 더 입력하셨으면 이 결과는 버린다
    var u = map[uid];
    if (!u) {
      el.className = 'lookup-hint bad';
      el.innerHTML = '이 계정 ID로 회원을 찾지 못했습니다 — ID를 다시 확인해 주세요.';
      return;
    }
    var st = u.status || 'active';
    if (st === 'withdrawn') {
      el.className = 'lookup-hint bad';
      el.innerHTML = '<b>탈퇴한 계정</b>입니다 — 이 ID로는 앱에 다시 들어갈 수 없어 시연에 쓸 수 없습니다.';
      return;
    }
    if (st === 'suspended') {
      el.className = 'lookup-hint bad';
      el.innerHTML = '<b>정지된 계정</b>입니다 · 닉네임 <b>' + esc(u.nickname || '(없음)') + '</b>';
      return;
    }
    el.innerHTML = '닉네임 <b>' + esc(u.nickname || '(없음)') + '</b> · 카카오 '
      + (u.linked_kakao === true ? '<b>연동</b>' : '<b>미연동</b>');
  }).catch(function (e) {
    if (seq !== ACC_HINT_SEQ) return;
    console.error('조회', e);
    el.className = 'lookup-hint bad';
    el.innerHTML = '회원 정보를 읽지 못했습니다.';
  });
}
var ACC_HINT_TIMER = null;
document.getElementById('f-acc').addEventListener('input', function () {
  clearTimeout(ACC_HINT_TIMER);
  ACC_HINT_TIMER = setTimeout(refreshAccHint, 400);
});

/* ── 바인딩 ── */
document.getElementById('btn-add').addEventListener('click', function () { openAcc(null); });
document.getElementById('m-acc-x').addEventListener('click', function () { closeModal('m-acc'); });
document.getElementById('m-acc-cancel').addEventListener('click', function () { closeModal('m-acc'); });
document.getElementById('m-acc-save').addEventListener('click', saveAcc);
document.getElementById('m-del-x').addEventListener('click', function () { closeModal('m-del'); });
document.getElementById('m-del-cancel').addEventListener('click', function () { closeModal('m-del'); });
document.getElementById('m-del-ok').addEventListener('click', doDel);
['m-acc', 'm-del'].forEach(function (id) {
  document.getElementById(id).addEventListener('click', function (e) {
    if (e.target === this) closeModal(id);
  });
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') { closeModal('m-acc'); closeModal('m-del'); }
});
document.addEventListener('click', function (e) {
  var chip = e.target.closest('[data-copy]');
  if (chip) {
    copyText(chip.getAttribute('data-copy'))
      .then(function () { toast('계정 ID를 복사했습니다.'); })
      .catch(function () { toast('복사에 실패했습니다.'); });
    return;
  }
  var ed = e.target.closest('[data-edit]');
  if (ed) { openAcc(ed.getAttribute('data-edit')); return; }
  var dl = e.target.closest('[data-del]');
  if (dl) { openDel(dl.getAttribute('data-del')); return; }
});

load();
</script>

<!-- 한/베 토글 — 엔진은 CMS(cms/index.html)의 번역기를 그대로 가져왔다.
     사전(KO2VI)에 있는 문자열만, 그것도 트림한 값이 통째로 일치할 때만 바꾼다.
     그래서 계정 ID·사용자 이름·앱이 만든 닉네임·형님이 적으신 메모는 건드리지 않는다.

<script>
(function(){
  var KO2VI = {

  "Firestore 규칙에": "Quy tắc công khai",

  "에 규칙은 들어가 있으니, Firebase 콘솔 → Firestore Database → 규칙에서 한 번 게시하면 바로 열립니다.": "của kho mã, chỉ cần phát hành một lần tại Firebase Console → Firestore Database → Rules là mở ngay.",

  "닉네임": "Biệt danh",
  "계정 ID": "ID tài khoản",
  "카카오": "Kakao",
  "· 카카오": "· Kakao",
  "메모": "Ghi chú",
  "수정": "Chỉnh sửa",
  "삭제": "Xóa",
  "연동": "Liên kết",
  "미연동": "Chưa LK",
  "탈퇴한 계정": "Tài khoản đã rút",
  "정지된 계정": "Tài khoản bị đình chỉ",
  "없는 계정": "Tài khoản không tồn tại",
  "계정 추가": "Thêm tài khoản",
  "계정 수정": "Sửa tài khoản",
  "사용자 *": "Người dùng *",
  "계정 ID *": "ID tài khoản *",
  "등록된 사용자": "Người dùng đã đăng ký",
  "아직 등록된 사용자가 없습니다. 새로 적어 주세요.": "Chưa có người dùng nào được đăng ký. Hãy nhập mới.",
  "계정 ID를 넣으면 닉네임과 카카오 연동 여부를 찾아 보여드립니다.": "Nhập ID tài khoản sẽ tra và hiển thị biệt danh cùng trạng thái liên kết Kakao.",
  "취소": "Hủy",
  "저장": "Lưu",
  "계정 삭제": "Xóa tài khoản",
  "줄을 지웁니다. 되돌릴 수 없습니다.": "sẽ bị xóa. Không thể hoàn tác.",
  "이 계정": "tài khoản này",
  "등록된 계정이 없습니다. 「+ 계정 추가」로 넣으세요.": "Chưa có tài khoản nào. Hãy thêm bằng 「+ Thêm tài khoản」.",
  "규칙이 게시되면 여기에 명부가 뜹니다.": "Danh bạ sẽ hiện ở đây khi quy tắc được phát hành.",
  "불러오는 중…": "Đang tải…",
  "저장 중…": "Đang lưu…",
  "삭제 중…": "Đang xóa…",
  "회원 정보를 찾는 중…": "Đang tìm thông tin thành viên…",
  "이 계정 ID로 회원을 찾지 못했습니다 — ID를 다시 확인해 주세요.": "Không tìm thấy thành viên với ID tài khoản này — hãy kiểm tra lại ID.",
  "입니다 — 이 ID로는 앱에 다시 들어갈 수 없어 시연에 쓸 수 없습니다.": " — không thể vào lại ứng dụng bằng ID này nên không dùng được cho demo.",
  "입니다 · 닉네임": " · Biệt danh",
  "(없음)": "(không có)",
  "사용자는 반드시 넣어야 합니다.": "Bắt buộc phải nhập người dùng.",
  "계정 ID는 반드시 넣어야 합니다.": "Bắt buộc phải nhập ID tài khoản.",
  "저장이 막혀 있습니다 — demo_accounts 규칙이 아직 게시되지 않았습니다.": "Việc lưu đang bị chặn — quy tắc demo_accounts chưa được phát hành.",
  "삭제가 막혀 있습니다 — 규칙 게시가 필요합니다.": "Việc xóa đang bị chặn — cần phát hành quy tắc.",
  "고쳤습니다.": "Đã sửa.",
  "넣었습니다.": "Đã thêm.",
  "지웠습니다.": "Đã xóa.",
  "계정 ID를 복사했습니다.": "Đã sao chép ID tài khoản.",
  "복사에 실패했습니다.": "Sao chép thất bại.",
  "회원 정보를 읽지 못했습니다 — 닉네임·카카오 칸이 빕니다.": "Không đọc được thông tin thành viên — ô biệt danh·Kakao sẽ trống.",
  "회원 정보를 읽지 못했습니다.": "Không đọc được thông tin thành viên.",
  "고르거나 새로 적으세요": "Chọn hoặc nhập mới",
  "앱 마이 화면에서 복사한 ID": "ID đã sao chép từ màn hình Của tôi",
  "비워 둬도 됩니다": "Có thể để trống",
  "눌러서 전체 ID 복사": "Nhấn để sao chép toàn bộ ID",
  "등록된 사용자 고르기": "Chọn người dùng đã đăng ký",
  "닫기": "Đóng",
  "프라이스픽 데모 계정 관리": "Quản lý tài khoản demo PricePick",
  "탈퇴": "Đã rút",
  "정지": "Bị đình chỉ"
};
  var _orig=new Map(), _tracked=new Set(), _applying=false;
  function hasKo(s){ return /[가-힯ᄀ-ᇿ㄰-㆏]/.test(s); }
  function tcore(s){
    var t=s.trim(); if(!t||!hasKo(t)) return null;
    var vi=KO2VI[t]; if(vi!=null) return s.replace(t,vi);
    return null;
  }
  /* ── 숫자-단위 붙음 방지(VI 공통) ──
     한국어는 "11건"처럼 숫자와 단위를 붙여 쓰지만 베트남어는 "11 trường hợp"처럼 띄어 써야 한다.
     사전은 단위 텍스트 노드만 치환하므로("건"→"trường hợp") 그대로 두면 "11trường hợp"이 된다.
     그래서 번역 결과가 문자로 시작하고 바로 앞 인라인 내용이 숫자로 끝나면 공백 한 칸을 끼워 넣는다.
     특정 화면 땜질이 아니라 번역 엔진 공통 처리라 전 메뉴에 한 번에 적용된다. */
  function prevInlineChar(n){
    var cur=n, guard=0;
    while(cur&&guard++<64){
      var p=cur.previousSibling;
      while(p){
        if(p.nodeType===3){ if(p.nodeValue) return p.nodeValue.slice(-1); }
        else if(p.nodeType===1){
          var t=p.textContent;
          if(t) return isInlineEl(p) ? t.slice(-1) : '';
        }
        p=p.previousSibling;
      }
      cur=cur.parentNode;
      if(!cur||cur.nodeType!==1||cur===document.body||!isInlineEl(cur)) break;
    }
    return '';
  }
  function isInlineEl(el){
    var d;
    try{ d=getComputedStyle(el).display; }catch(e){ return false; }
    return d.indexOf('inline')===0||d==='contents';
  }
  function viPad(n,out){
    if(!/^[0-9A-Za-zÀ-ỹĐđ]/.test(out)) return out;
    return /[0-9]$/.test(prevInlineChar(n)) ? ' '+out : out;
  }
  function trNode(n){
    var out=tcore(n.nodeValue);
    if(out!=null&&out!==n.nodeValue){
      out=viPad(n,out);
      if(!_orig.has(n)) _orig.set(n,n.nodeValue);
      _tracked.add(n); n.nodeValue=out;
    }
  }
  function walk(root){
    if(!root) return;
    if(root.nodeType===3){trNode(root);return;}
    if(root.nodeType!==1&&root.nodeType!==11) return;
    var w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:function(nd){
      var p=nd.parentNode; if(!p) return NodeFilter.FILTER_REJECT;
      var t=p.nodeName; if(t==='SCRIPT'||t==='STYLE'||t==='NOSCRIPT') return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT;
    }});
    var arr=[],n; while(n=w.nextNode()) arr.push(n);
    for(var i=0;i<arr.length;i++) trNode(arr[i]);
  }
  var ATTRS=['placeholder','title','value','alt','aria-label'];
  function attrSweep(){
    var els=document.querySelectorAll('['+ATTRS.join('],[')+']');
    for(var i=0;i<els.length;i++){var el=els[i];
      for(var j=0;j<ATTRS.length;j++){var a=ATTRS[j];
        if(!el.hasAttribute(a)) continue;
        var v=el.getAttribute(a); if(!hasKo(v)) continue;
        var core=v.trim(),vi=KO2VI[core]; if(vi==null) continue;
        var k='_ipa_'+a; if(el[k]==null) el[k]=v;
        var p=v.indexOf(core);
        el.setAttribute(a, v.slice(0,p)+vi+v.slice(p+core.length));
      }
    }
  }
  function attrRestore(){
    var els=document.querySelectorAll('*');
    for(var i=0;i<els.length;i++){var el=els[i];
      for(var j=0;j<ATTRS.length;j++){var k='_ipa_'+ATTRS[j];
        if(el[k]!=null){el.setAttribute(ATTRS[j],el[k]);el[k]=null;}
      }
    }
  }
  function restore(){
    _tracked.forEach(function(n){var o=_orig.get(n); if(o!=null) n.nodeValue=o;});
    _tracked.clear(); attrRestore();
  }
  var _obs=null;
  function startObs(){
    if(_obs||!window.MutationObserver) return;
    _obs=new MutationObserver(function(muts){
      if(IPLANG!=='vi'||_applying) return;
      _applying=true;
      for(var i=0;i<muts.length;i++){var m=muts[i];
        if(m.type==='characterData'){trNode(m.target);}
        else if(m.addedNodes){for(var j=0;j<m.addedNodes.length;j++){var nd=m.addedNodes[j];
          if(nd.nodeType===3) trNode(nd); else if(nd.nodeType===1){walk(nd);attrSweep();}}}
      }
      _applying=false;
    });
    _obs.observe(document.body,{childList:true,characterData:true,subtree:true});
  }
  var IPLANG='ko';
  window.ipSetLang=function(lang){
    lang=(lang==='vi')?'vi':'ko';
    if(lang===IPLANG) return;
    IPLANG=lang; document.documentElement.lang=lang;
    _applying=true;
    if(lang==='vi'){walk(document.body);attrSweep();} else {restore();}
    _applying=false;
    var t=document.getElementById('ip-lang-toggle');
    if(t){t.setAttribute('data-lang',lang);
      var ko=t.querySelector('[data-l="ko"]'),vi=t.querySelector('[data-l="vi"]');
      if(ko) ko.className=(lang==='ko')?'on':'';
      if(vi) vi.className=(lang==='vi')?'on':'';
    }
  };
  window.ipGetLang=function(){return IPLANG;};
  function bind(){
    startObs();
    var t=document.getElementById('ip-lang-toggle');
    if(t&&!t.dataset.b){t.dataset.b='1';
      t.addEventListener('click',function(e){
        e.stopPropagation();
        var next=IPLANG==='vi'?'ko':'vi';
        if(next==='ko'){
          if(window.ipSetLang) window.ipSetLang('ko');
          if(typeof applyLang==='function') applyLang();
        } else {
          if(typeof applyLang==='function') applyLang();
          if(window.ipSetLang) window.ipSetLang('vi');
        }
      });
    }
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',bind);
  else bind();
})();

</script>
<script>
/* 숫자가 낀 문구는 사전으로 못 잡아 render()가 직접 만든다 — 언어를 바꾸면 다시 그린다. */
(function(){
  var orig = window.ipSetLang;
  if (!orig) return;
  window.ipSetLang = function(lang){
    orig(lang);
    if (typeof render === 'function') { try { render(); } catch(e) { console.error('render', e); } }
  };
})();
</script>
