<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>PricePick DEMO — ASP CMS</title>
<link rel="icon" href="/cms/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/cms/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
/* Layout: 프라이스픽 CMS 결 — 좌측 흰 사이드바 240px + 상단바 58px(매체 전환) + 본문 카드. 라이트 단일 톤 */
:root{
  --main:#845EEE; --main-dark:#6C4AB6; --main-soft:rgba(132,94,238,.08); --main-line:rgba(132,94,238,.22);
  --sb-active:#6366f1; --sb-active-dk:#4f46e5; --sb-hover:#F5F3FF; --sb-text:#374151; --sb-sub:#9CA3AF; --sb-bdr:#E5E7EB;
  --bg:#F4F1FB; --surface:#FFFFFF; --surface-2:#F8F7FC; --surface-3:#EEE9F8; --border:#E4DFF0;
  --text:#1A1130; --text-2:#5A5370; --text-3:#857D9B;
  --success:#16A34A; --success-soft:rgba(22,163,74,.1); --danger:#DC2626; --danger-soft:rgba(220,38,38,.1);
  --amber:#B45309; --amber-soft:rgba(217,119,6,.12);
  --r-sm:6px; --r-md:10px; --r-lg:14px; --r-xl:18px;
  --ctl-h:36px; --ctl-h-sm:28px;
  --font:'Pretendard Variable','Pretendard','Noto Sans KR',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:13px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--main);outline-offset:2px}

.app{display:flex;min-height:100%}
.sidebar{width:240px;flex:none;background:#FFFFFF;border-right:1.5px solid var(--sb-bdr);display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;z-index:300}
.sb-logo{padding:14px 16px 12px;border-bottom:1.5px solid var(--sb-bdr);display:flex;align-items:center;gap:10px;min-height:58px}
.sb-mark{width:34px;height:34px;border-radius:10px;flex:none;background:linear-gradient(135deg,#845EEE,#6366f1);display:flex;align-items:center;justify-content:center;color:#FFFFFF;box-shadow:0 3px 10px rgba(99,102,241,.3)}
.sb-name{font-size:15px;font-weight:800;color:#111827;letter-spacing:-.3px}
.sb-sub{font-size:10px;color:#9CA3AF;margin-top:2px}
.sb-nav{flex:1;overflow-y:auto;padding:8px 0 16px}
.sb-grp{padding:10px 16px 4px;font-size:10px;font-weight:700;color:#9CA3AF;letter-spacing:.9px}
.sb-item{display:flex;align-items:center;gap:10px;width:100%;padding:8px 12px 8px 18px;border:0;background:none;color:var(--sb-text);font-size:13px;font-weight:500;text-align:left}
.sb-item:hover{background:var(--sb-hover);color:var(--sb-active)}
.sb-item[aria-current="page"]{background:var(--sb-active);color:#FFFFFF;font-weight:600}
.sb-item svg{width:18px;height:18px;flex:none}
.sb-badge{margin-left:auto;background:#EF4444;color:#FFFFFF;font-size:10px;font-weight:700;border-radius:10px;padding:1px 7px;min-width:18px;text-align:center}
.sb-item[aria-current="page"] .sb-badge{background:rgba(255,255,255,.25)}
.sb-foot{padding:12px 14px;border-top:1.5px solid var(--sb-bdr);display:flex;align-items:center;gap:10px}
.sb-avatar{width:32px;height:32px;border-radius:50%;background:var(--sb-active);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#FFFFFF;flex:none}
.sb-user b{display:block;font-size:12px;color:#111827}
.sb-user span{font-size:10px;color:#9CA3AF}

.main{margin-left:240px;flex:1;min-width:0}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 28px;min-height:58px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:50}
.tb-left{display:flex;align-items:center;gap:10px;min-width:0}
.tb-bc{font-size:12px;color:var(--text-3)}
.tb-title{font-size:15px;font-weight:700;letter-spacing:-.3px}
.tb-menu{display:none;width:36px;height:36px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--surface-2);align-items:center;justify-content:center}
.tb-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tb-lbl{font-size:12px;font-weight:600;color:var(--text-2)}
.seg{display:inline-flex;padding:3px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border)}
.seg button{height:30px;padding:0 14px;border:0;border-radius:999px;background:none;font-size:12px;font-weight:700;color:var(--text-2);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--main);color:#FFFFFF}
.chip-ex{background:var(--main-soft);color:var(--main-dark);padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600;border:1px solid var(--main-line);white-space:nowrap}

.content{padding:26px}
.content.fade{animation:fade .18s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);margin-bottom:16px;min-width:0}
.card-h{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.card-t{margin:0;font-size:14px;font-weight:700}
.card-s{font-size:12px;color:var(--text-2);margin-top:2px}
.card-b{padding:16px 20px}
.tbl-wrap{overflow-x:auto}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px 20px;min-width:0}
.stat-l{font-size:12px;color:var(--text-2);font-weight:600;margin-bottom:10px}
.stat-v{font-size:26px;font-weight:800;letter-spacing:-.8px;line-height:1.1;font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:4px}
.stat-v small{font-size:13px;font-weight:700;letter-spacing:0}
.stat-s{font-size:12px;color:var(--text-2);margin-top:8px;font-variant-numeric:tabular-nums}
.alert{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 18px;margin-bottom:16px;border-radius:var(--r-lg);background:var(--danger-soft);border:1px solid rgba(220,38,38,.25);color:#991B1B;font-weight:600}
.alert span{display:flex;align-items:center;gap:8px}

table{width:100%;border-collapse:collapse}
th{text-align:center;padding:10px 18px;font-size:11px;color:var(--text-2);font-weight:600;letter-spacing:.4px;border-bottom:1px solid var(--border);background:var(--surface-2);white-space:nowrap;position:relative}
th:not(:last-child)::after{content:"";position:absolute;right:0;top:30%;height:40%;width:1px;background:rgba(0,0,0,.13)}
td{padding:12px 18px;font-size:13px;border-bottom:1px solid var(--border);white-space:nowrap;font-variant-numeric:tabular-nums;text-align:center}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--surface-2)}
.dt b{display:block;font-weight:700;color:#333333}
.dt span{display:block;font-size:12px;color:var(--text-2)}
.who b{display:block;font-weight:600}
.who span{display:block;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:var(--text-3)}
button.who{border:0;background:none;padding:0;margin:0 auto;text-align:center}
button.who b{color:var(--main-dark);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--main-line)}
.tk{display:inline-flex;align-items:center;gap:5px;font-weight:700}
.tk.miss{color:var(--text-3);text-decoration:line-through}
.coin{display:inline-flex;align-items:center;gap:5px;font-weight:700;color:#92400E}
.mc{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.mc img,.mc i{width:20px;height:20px;border-radius:6px;object-fit:cover;flex:none}
.mc i{display:inline-flex;align-items:center;justify-content:center;background:#1A1130;color:#FFFFFF;font-style:normal;font-size:11px;font-weight:800}
.mall{display:inline-flex;align-items:center;gap:8px;font-weight:600}
.mall img{width:24px;height:24px;border-radius:50%;object-fit:cover;background:#FFFFFF;border:1px solid var(--border);flex:none}
.num{font-weight:600}
.r{color:var(--text-2)}
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.badge-green{background:var(--success-soft);color:var(--success)}
.badge-red{background:var(--danger-soft);color:var(--danger)}
.badge-amber{background:var(--amber-soft);color:var(--amber)}
.badge-gray{background:rgba(155,147,176,.14);color:var(--text-2)}
.badge-purple{background:var(--main-soft);color:var(--main-dark)}
.fail{color:var(--danger);font-weight:600}
.empty{padding:40px 20px;text-align:center;color:var(--text-2);font-size:13px}

.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.search{height:var(--ctl-h);min-width:240px;padding:0 13px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--surface);font-size:13px;outline:none}
.search:focus{border-color:var(--main)}
.search::placeholder{color:var(--text-3)}
.sel{height:var(--ctl-h);padding:0 12px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--surface);color:var(--text-2);font-size:13px}
.count{margin-left:auto;font-size:12px;color:var(--text-2)}
.btn{height:var(--ctl-h-sm);padding:0 12px;border:0;border-radius:var(--r-sm);font-size:12px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
.btn-l{height:var(--ctl-h);padding:0 16px;border-radius:var(--r-md);font-size:13px}
.btn-primary{background:var(--main);color:#FFFFFF}
.btn-primary:hover{background:var(--main-dark)}
.btn-primary[disabled]{opacity:.35;cursor:default}
.btn-ghost{background:var(--surface);color:var(--text-2);border:1px solid var(--border)}
.btn-ghost:hover{color:var(--text);border-color:var(--text-2)}
.btn-danger{background:var(--danger);color:#FFFFFF}
.icon-btn{width:28px;height:28px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--surface);color:var(--text-2);display:inline-flex;align-items:center;justify-content:center;padding:0}
.icon-btn[disabled]{opacity:.3;cursor:default}
.cell-input{height:var(--ctl-h-sm);width:150px;padding:0 10px;border:1px solid var(--border);border-radius:var(--r-sm);font-size:12px;background:var(--surface);text-align:center}
.cell-sel{height:var(--ctl-h-sm);padding:0 8px;border:1px solid var(--border);border-radius:var(--r-sm);font-size:12px;background:var(--surface)}
.sw{width:36px;height:20px;border-radius:10px;border:0;padding:0;background:#D7D2E3;position:relative;transition:background .2s;vertical-align:middle}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#FFFFFF;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .2s}
.sw[aria-checked="true"]{background:var(--main)}
.sw[aria-checked="true"]::after{transform:translateX(16px)}
.tok{display:inline-block;padding:0 6px;border-radius:5px;background:var(--main-soft);color:var(--main-dark);font-weight:700;font-size:12px}
.q-cell{text-align:left!important;white-space:normal;min-width:260px}

.expo{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.pv{position:sticky;top:84px}
.pv-phone{margin:0 auto;width:300px;border-radius:30px;padding:18px 16px 22px;background:#131419;color:#F4F5F8;box-shadow:0 0 0 7px #0E0F13}
.pv-h{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;font-weight:700}
.pv-h span{font-size:11px;font-weight:500;color:#8A8E9C}
.pv-grid{margin-top:36px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));row-gap:18px;column-gap:4px}
.pv-m{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:#E3E5EC;white-space:nowrap}
.pv-m img{width:48px;height:48px;border-radius:50%;object-fit:cover;background:#FFFFFF}
.pv-m.down{color:#8A8E9C}
.pv-m.down img{filter:grayscale(1);opacity:.4}
.pv-b{position:absolute;top:-28px;left:50%;transform:translateX(-50%);padding:3px 8px;border:1.5px solid #9B7BFF;border-radius:12px;background:#131419;color:#F4F5F8;font-size:10px;font-weight:700;white-space:nowrap}
.pv-cap{margin-top:12px;text-align:center;font-size:12px;color:var(--text-2)}

.overlay{position:fixed;inset:0;z-index:400;background:rgba(26,17,48,.35);display:flex;align-items:center;justify-content:center;padding:16px}
.modal{width:560px;max-width:100%;max-height:calc(100vh - 32px);overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-xl);box-shadow:0 12px 36px rgba(0,0,0,.14)}
.modal-h{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-h h2{margin:0;font-size:15px;font-weight:700}
.modal-b{padding:20px 22px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.modal-f{padding:14px 22px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld.full{grid-column:1 / -1}
.fld label{font-size:12px;font-weight:700;color:var(--text-2)}
.inp{height:var(--ctl-h);padding:0 12px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--surface-2);font-size:13px;width:100%}
.inp:focus{outline:none;border-color:var(--main);background:var(--surface)}
.inp[readonly]{color:var(--text-3)}
textarea.inp{height:auto;min-height:110px;padding:10px 12px;line-height:1.7;resize:vertical}
.ratio{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:600}
.ratio .inp{width:90px;text-align:center}
.help{font-size:12px;color:var(--text-2)}
.tokrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tokval{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;padding:7px 10px;border-radius:var(--r-sm);background:var(--surface-2);border:1px solid var(--border)}
.confirm{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px;border-radius:var(--r-md);background:var(--danger-soft);color:#991B1B;font-size:12px;font-weight:600}
.pvbox{padding:12px 14px;border-radius:var(--r-md);background:var(--surface-2);border:1px solid var(--border);font-size:13px;line-height:1.7}
.pvbox b{display:block;margin-bottom:4px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:500;padding:12px 18px;border-radius:12px;background:#1A1130;color:#FFFFFF;font-size:13px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:calc(100vw - 32px)}
.scrim{display:none}
/* CMS DEMO 안에 끼워 쓸 때(?embed=1) — 사이드바·제목은 CMS DEMO 것을 쓰고, 여기서는 매체 전환만 남긴다 */
html.embed .sidebar,html.embed .scrim,html.embed .tb-menu,html.embed .tb-left{display:none}
html.embed .main{margin-left:0}
html.embed .topbar{justify-content:flex-end;min-height:52px;padding:8px 26px}
@media (max-width:900px){html.embed .topbar{padding:8px 16px}}
/* CMS DEMO 연동 */
.sb-ext{display:flex;align-items:center;gap:8px;margin:0 12px 10px;padding:9px 12px;border:1px solid var(--sb-bdr);border-radius:var(--r-md);color:var(--sb-text);font-size:12px;font-weight:600;text-decoration:none}
.sb-ext:hover{border-color:var(--sb-active);color:var(--sb-active)}
.sb-ext svg{flex:none}
.sb-ext span{flex:1}
.lk{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;border:1px solid var(--main-line);background:var(--main-soft);color:var(--main-dark);font-size:11px;font-weight:700;text-decoration:none;white-space:nowrap;vertical-align:middle}
.lk:hover{background:var(--main);color:#FFFFFF;border-color:var(--main)}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--text-2)}
.live i{width:8px;height:8px;border-radius:50%;background:#C9C3D8;flex:none}
.live.ok i{background:var(--success);box-shadow:0 0 0 3px var(--success-soft)}
.live.fail i{background:var(--amber)}
.flow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;padding:18px 20px}
.fl{position:relative;padding:14px;border-radius:var(--r-md);border:1px solid var(--border);background:var(--surface-2);min-width:0}
.fl:not(:last-child)::after{content:"";position:absolute;right:-9px;top:50%;width:8px;height:8px;border-top:2px solid var(--main);border-right:2px solid var(--main);transform:translateY(-50%) rotate(45deg);z-index:1}
.fl-n{font-size:11px;font-weight:800;color:var(--main)}
.fl-t{margin-top:4px;font-size:13px;font-weight:700}
.fl-o{margin-top:8px}
.fl-d{margin-top:8px;font-size:12px;line-height:1.55;color:var(--text-2)}
.kv{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:16px 20px}
.kv-chain{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;font-weight:600}
.kv-chain b{font-size:15px;font-weight:800;color:var(--text)}
.kv-chain .ar{color:var(--text-3)}
.d-cell{text-align:left!important;white-space:normal;min-width:240px;color:var(--text-2);line-height:1.55}
.l-cell{text-align:left!important;white-space:normal;min-width:150px}
.legend{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* 데이터 출처 띠 — 실데이터(CMS DEMO 로그인) / 예시 데이터 */
.src{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 16px;padding:10px 14px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--border);font-size:13px;color:var(--text-2)}
.src i{width:8px;height:8px;border-radius:50%;background:var(--amber);flex:none}
.src.ok i{background:var(--success);box-shadow:0 0 0 3px var(--success-soft)}
.src b{color:var(--text)}
.src .sp{flex:1}
.src a{color:var(--main-dark);font-weight:600;text-decoration:none}
.src a:hover{text-decoration:underline}
.mall-lt{width:24px;height:24px;border-radius:50%;background:var(--surface-3);color:var(--text-2);display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:11px;font-weight:700;flex:none}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px}
.tries{display:block;font-size:11px;color:var(--text-3);margin-top:2px}
.tokbadge{margin-left:6px}

@media (prefers-reduced-motion:reduce){.content.fade{animation:none}.sw,.sw::after{transition:none}}
@media (max-width:1180px){.flow{grid-template-columns:repeat(2,minmax(0,1fr))}.fl::after{display:none}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.expo{grid-template-columns:minmax(0,1fr)}.pv{position:static}}
@media (max-width:900px){
  .sidebar{transform:translateX(-100%);transition:transform .2s}
  .app.nav .sidebar{transform:none;box-shadow:0 0 40px rgba(0,0,0,.2)}
  .app.nav .scrim{display:block;position:fixed;inset:0;z-index:250;background:rgba(26,17,48,.25)}
  .main{margin-left:0}
  .tb-menu{display:inline-flex}
  .topbar{padding:10px 16px}
  .content{padding:16px}
  .search{min-width:0;flex:1 1 200px}
  .modal-b{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:520px){.flow{grid-template-columns:minmax(0,1fr)}.stats{grid-template-columns:minmax(0,1fr)}.tb-bc{display:none}.pv-phone{width:100%;max-width:300px}}
</style>
<style>
/* 열람 비밀번호 */
html:not(.unlocked) .app, html:not(.unlocked) #modalSlot, html:not(.unlocked) #toastSlot{display:none}
html.unlocked .gate{display:none}
.gate{--g-paper:#FFFFFF;--g-rule:#D6D8E1;--g-violet:#845EEE;--g-deep:#5A3BC4;--g-soft:#EFEAFD;--g-red:#B4232F;position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--bg);font-family:var(--font);color:var(--text)}
.gate form{width:100%;max-width:380px;box-sizing:border-box;background:var(--g-paper);border:1px solid var(--g-rule);border-top:3px solid var(--g-violet);border-radius:12px;padding:30px 28px 26px;box-shadow:0 10px 30px rgba(22,23,29,.06)}

.gate input{flex:1;min-width:0;font:inherit;font-size:1rem;padding:10px 12px;border:1px solid var(--g-rule);border-radius:8px;color:var(--text);background:var(--g-paper)}

.gate .g-err{min-height:1.4em;margin:10px 0 0;font-size:.86rem;color:var(--g-red)}

  var root=document.documentElement, form=document.getElementById("gate-form"),
      pw=document.getElementById("gate-pw"), err=document.getElementById("gate-err");

  pw.focus();
  form.addEventListener("submit",function(e){
    e.preventDefault();
    if(pw.value==="1111"){
      try{ sessionStorage.setItem("dsn-20261012-asp-cms","ok"); }catch(x){}
      root.classList.add("unlocked");
      err.classList.remove("show");
      window.scrollTo(0,0);
      window.dispatchEvent(new Event("resize"));
    }else{
      err.classList.remove("show"); void err.offsetWidth; err.classList.add("show");
      pw.setAttribute("aria-invalid","true");
      pw.value="";
      pw.focus();
    }
  });
})();
</script>

const CST={ok:['지급 완료','badge-green'],wait:['자동 재시도 중','badge-amber'],stuck:['운영자 확인','badge-red'],fail:['실패 확정','badge-gray']};
function csvMonths(){ const base=isLive()?new Date(RD.now+9*3600e3):new Date(Date.UTC(2026,9,15)); const out=[]; for(let i=0;i<3;i++){const d=new Date(Date.UTC(base.getUTCFullYear(),base.getUTCMonth()-i,1)); out.push(d.toISOString().slice(0,7));} return out; }
function convs(){

const content=document.getElementById('content'), nav=document.getElementById('nav'), seg=document.getElementById('mediaSeg'), slot=document.getElementById('modalSlot'), app=document.getElementById('app');

let tt=null;
function toast(m){clearTimeout(tt);document.getElementById('toastSlot').innerHTML=`<div class="toast" role="status">${esc(m)}</div>`;tt=setTimeout(()=>{document.getElementById('toastSlot').innerHTML='';},2400);}
function go(sec){ if(S.sec==='expo'&&sec!=='expo'){expoDraft=null;S.dirty=false;} S.sec=sec; S.q=''; app.classList.remove('nav'); render(true); scrollTo(0,0); }

function act(a,arg,el){
  switch(a){
    case 'sec': go(arg); break;
    case 'media': S.media=arg; if(MEDIA.some(m=>m.id===arg)&&S.sec==='expo'&&!S.dirty){S.expoMedia=arg;expoDraft=null;} render(); break;
    case 'goFails': S.cst='need'; go('convs'); S.cst='need'; render(); break;
    case 'reloadLive': RD.st=RD.st==='ok'?'ok':'init'; loadLive(); break;
    case 'csv': csvDownload(); break;
    case 'memberBuys': S.sec='buys'; S.bst='all'; render(true); S.q=arg; render(); scrollTo(0,0); break;
    case 'retry': {
      if(isLive()){ liveRetry(arg,el); break; }
      const c=CONVS.find(x=>String(x.id)===String(arg)); if(!c) return;
      c.st='ok'; c.why=''; c.tries=(c.tries||1)+1; const m=memberOf(c.nick); if(m){m.done=Math.max(0,m.done-c.t); m.conv+=c.c;}
      if(STAT[c.media]) STAT[c.media].coins+=c.c;
      toast(`${c.nick} 님 ${mediaOf(c.media).coin} ${c.c}개 전환을 마쳤어요`); render(); break;
    }
    case 'mediaEdit': { const m=mediaOf(arg); S.modal={t:'media',id:arg,isNew:false,confirm:false,draft:Object.assign({},m)}; render(); break; }
    case 'mediaNew': S.modal={t:'media',id:null,isNew:true,confirm:false,draft:{id:'',name:'',code:'',status:'ready',entry:'',coin:'',ratio:null,token:'0000',logo:null}}; render(); break;
    case 'tokenAsk': readMedia(); S.modal.confirm=true; render(); break;
    case 'tokenCancel': readMedia(); S.modal.confirm=false; render(); break;
    case 'tokenDo': readMedia(); S.modal.draft.token=Math.random().toString(16).slice(2,6); S.modal.confirm=false; render(); toast('새 연동 토큰을 발급했어요. 저장하면 적용돼요'); break;
    case 'mediaSave': {
      readMedia(); const d=S.modal.draft;
      if(!d.name.trim()||!d.code.trim()){ toast('매체 이름과 매체 코드를 입력해 주세요'); return; }
      if(isLive()){ liveMediaSave(d); return; }
      if(S.modal.isNew){ d.id='m'+Date.now().toString(36); d.code=d.code.toUpperCase(); MEDIA.push(d); STAT[d.id]={members:0,buys:0,gmv:0,fee:0,tickets:0,pending:0,coins:0}; EXPO[d.id]=expoOf(false); toast(`${d.name} 매체를 추가했어요`); }
      else { Object.assign(mediaOf(S.modal.id),d); toast(`${d.name} 설정을 저장했어요`); }
      S.modal=null; render(); break;
    }
    case 'close': S.modal=null; render(); break;
    case 'expoMedia': if(S.dirty){toast('저장하지 않은 변경사항이 있어요. 먼저 저장해 주세요');return;} S.expoMedia=arg; expoDraft=null; render(); break;
    case 'up': case 'down': { const i=+arg, j=a==='up'?i-1:i+1; const t=expoDraft[i]; expoDraft[i]=expoDraft[j]; expoDraft[j]=t; S.dirty=true; render(); break; }
    case 'expoSave': if(isLive()){ liveExpoSave(); break; } EXPO[S.expoMedia]=expoDraft.map(x=>Object.assign({},x)); S.dirty=false; toast(`${mediaOf(S.expoMedia).name} 쇼핑몰 노출을 저장했어요`); render(); break;
    case 'faqToggle': FAQ[+arg].on=!FAQ[+arg].on; toast(FAQ[+arg].on?'질문을 노출해요':'질문을 숨겼어요'); render(); if(isLive()) liveFaqSave(); break;
    case 'faqEdit': S.modal={t:'faq',i:+arg,isNew:false,draft:Object.assign({},FAQ[+arg])}; render(); break;
    case 'faqNew': S.modal={t:'faq',i:null,isNew:true,draft:{q:'',a:'',on:true}}; render(); break;
    case 'faqSave': {
      const q=document.getElementById('f-q').value.trim(), a2=document.getElementById('f-a').value.trim();
      if(!q||!a2){ toast('질문과 답변을 입력해 주세요'); return; }
      if(S.modal.isNew) FAQ.push({q,a:a2,on:true}); else Object.assign(FAQ[S.modal.i],{q,a:a2});
      S.modal=null; toast('질문을 저장했어요'); render(); if(isLive()) liveFaqSave(); break;
    }
  }
}
async function liveRetry(id,btn){
  if(btn){ btn.disabled=true; btn.textContent='보내는 중'; }
  try{
    const r=await adminApi('retry',{transaction_id:id});
    const st=r.conv.status;
    toast(st==='paid'?`${id} 지급 완료 — 같은 거래번호로 다시 보냈어요`:st==='failed'?`${id} 실패 확정 (${r.conv.code}) — 티켓을 회원에게 되돌렸어요`:`${id} 아직 응답이 없어요 (${r.conv.code}) — 운영자 확인으로 남겨요`);
  }catch(e){ toast(e.message); }
  loadLive();
}

async function csvDownload(){
  const sel=document.getElementById('csvMonth'); const month=sel?sel.value:'';
  const code=S.media==='all'?'TOPTOON':(mediaOf(S.media)||{}).code||'TOPTOON';
  try{
    const r=await adminApi('csv?media='+encodeURIComponent(code)+'&month='+encodeURIComponent(month));
    const blob=await r.blob(); const a=document.createElement('a');
    a.href=URL.createObjectURL(blob); a.download='asp_'+code+'_'+month.replace('-','')+'.csv'; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),2000);
    toast(`${code} ${month} 지급 내역을 내려받았어요`);
  }catch(e){ toast(e.message); }
}

}

  const t=e.target;
  if(t.id==='q'){ S.q=t.value; const pos=t.selectionStart; render(); const n=document.getElementById('q'); if(n){n.focus(); try{n.setSelectionRange(pos,pos);}catch(x){}} return; }
  if(t.dataset.field==='bubble'){ expoDraft[+t.dataset.i].bubble=t.value; S.dirty=true; const i=+t.dataset.i, pos=t.selectionStart; render(); const n=document.querySelector(`[data-field="bubble"][data-i="${i}"]`); if(n){n.focus(); try{n.setSelectionRange(pos,pos);}catch(x){}} return; }
  if(t.id==='f-ratio'||t.id==='f-coin'){ const r=parseInt(document.getElementById('f-ratio').value,10); const w=document.getElementById('f-won'); if(w) w.textContent=`코인 1개 = ${r>0?won(r*TICKET_WON):'—'}원 상당 (티켓 1장 ${won(TICKET_WON)}원)`; return; }
  if(t.id==='f-q'||t.id==='f-a'){ const m=S.media==='all'?MEDIA[0]:mediaOf(S.media); const pv=document.getElementById('f-pv'); if(pv) pv.innerHTML=`<b>${esc(fmt(document.getElementById('f-q').value,m))}</b>${esc(fmt(document.getElementById('f-a').value,m))}`; }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='bst'){ S.bst=t.value; render(); }
  if(t.id==='cst'){ S.cst=t.value; render(); }
  if(t.dataset.field==='st'){ expoDraft[+t.dataset.i].st=t.value; S.dirty=true; render(); }
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&S.modal){S.modal=null;render();} });
document.getElementById('menuBtn').addEventListener('click',()=>app.classList.toggle('nav'));
document.getElementById('scrim').addEventListener('click',()=>app.classList.remove('nav'));
const SEC_IDS=['dash','link','media','members','buys','convs','expo','faq'];
const fromHash=()=>{const s=location.hash.replace('#','');return SEC_IDS.indexOf(s)>=0?s:null;};
if(fromHash()) S.sec=fromHash();
window.addEventListener('hashchange',()=>{const s=fromHash(); if(s&&s!==S.sec){ S.modal=null; go(s); }});
window.aspCurrent=()=>S.sec;
render();
loadTicketValue();
fbAuth=fbInit();
if(fbAuth){
  fbAuth.onAuthStateChanged(u=>{
    if(u&&/@pricepick-cms\.internal$/.test(u.email||'')){ RD.admin=u.email.replace('@pricepick-cms.internal',''); loadLive(); }
    else { RD.st='nologin'; if(!S.modal) render(); }
  });
} else { RD.st='nologin'; render(); }
setInterval(()=>{ if(isLive()&&!document.hidden&&!S.modal&&!S.dirty) loadLive(); },20000);
})();
</script>
