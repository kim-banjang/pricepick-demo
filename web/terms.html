  <template id="doc-service">제1조 (목적)
본 약관은 주식회사 앱믹스(이하 &quot;회사&quot;)가 제공하는 PricePick 서비스(이하 &quot;서비스&quot;)의 이용과 관련하여 회사와 이용자의 권리·의무 및 책임사항을 규정함을 목적으로 합니다.

제2조 (정의)
1. &quot;서비스&quot;란 회사가 제공하는 경유 쇼핑 리워드 앱 및 관련 제반 서비스를 말합니다.
2. &quot;이용자&quot;란 본 약관에 따라 서비스를 이용하는 자를 말합니다.
3. &quot;경유 구매&quot;란 이용자가 서비스 내 구매 링크를 통해 제휴 쇼핑몰로 이동하여 상품을 구매하는 것을 말합니다.
4. &quot;티켓&quot;이란 경유 구매 및 서비스 활동에 따라 지급되는 리워드로, 1장당 10원의 가치를 가지는 티켓과 추첨 응모 등에 사용되는 이벤트 티켓으로 구분됩니다.
5. &quot;포인트&quot;란 출석·미션 등 서비스 활동에 따라 지급되는 리워드를 말합니다.
6. &quot;연동 계정&quot;이란 카카오 계정을 연동한 이용자의 계정을 말하며, &quot;미연동 계정&quot;이란 닉네임만으로 생성된 계정을 말합니다.

제3조 (약관의 게시 및 개정)
1. 회사는 본 약관을 서비스 초기 화면 또는 연결 화면에 게시합니다.
2. 회사는 관련 법령을 위배하지 않는 범위에서 약관을 개정할 수 있으며, 개정 시 적용일자 및 개정사유를 명시하여 적용일자 7일 전부터 공지합니다. 이용자에게 불리한 개정의 경우 30일 전부터 공지합니다.
3. 이용자가 개정 약관에 동의하지 않는 경우 서비스 이용을 중단하고 탈퇴할 수 있습니다.

제4조 (가입 자격 및 계정의 생성·관리)
1. 서비스는 만 14세 이상의 자가 이용할 수 있습니다.
2. 이용자는 닉네임 입력만으로 서비스를 이용할 수 있습니다. 카카오 계정 연동은 선택 사항입니다.
3. 다만 리워드의 사용·교환·추첨 응모 등 일부 기능은 카카오 계정 연동 후 이용할 수 있습니다.
4. 미연동 계정의 이용 정보는 앱 삭제 또는 기기 변경 시 복구되지 않습니다. 연동 계정의 정보는 재설치 후 연동 시 유지됩니다.
5. 이용자는 계정을 타인에게 양도·대여할 수 없습니다.

제5조 (서비스의 내용)
1. 회사는 다음의 서비스를 제공합니다.
  가. 제휴 쇼핑몰 경유 구매 연결
  나. 경유 구매에 따른 리워드 적립
  다. 출석·미션 등 활동 보상
  라. 추첨 및 경품 제공
  마. 기타 회사가 정하는 서비스
2. 회사는 서비스의 내용을 변경할 수 있으며, 중요한 변경 시 사전에 공지합니다.

제6조 (경유 구매 및 적립)
1. 리워드는 서비스 내 구매 링크를 통해 제휴 쇼핑몰로 이동하여 구매가 이루어진 경우에 한하여 적립됩니다.
2. 다음의 경우 적립이 인정되지 않을 수 있습니다.
  가. 서비스를 경유하지 않고 직접 구매한 경우
  나. 경유 후 다른 경로·앱을 거쳐 구매한 경우
  다. 제휴 쇼핑몰의 정책상 적립 대상이 아닌 상품·거래인 경우
  라. 기술적 사유로 구매 실적이 확인되지 않는 경우
3. 제2항 라목의 경우 이용자는 구매 내역 인증을 통해 적립을 신청할 수 있으며, 회사는 주문번호·금액·구매일시 등을 확인하여 처리합니다.

제7조 (티켓)
1. 티켓은 경유 구매 금액에 따라 지급되며, 티켓 1장의 가치는 10원입니다.
2. 티켓의 유효기간은 적립일로부터 1년, 이벤트 티켓의 유효기간은 지급일로부터 100일이며, 유효기간이 경과한 티켓은 소멸합니다.
3. 티켓은 현금으로 환급되지 않으며, 타인에게 양도할 수 없습니다.
4. 이벤트 티켓 1장은 티켓 2장으로 전환할 수 있습니다. 티켓은 이벤트 티켓으로 전환할 수 없습니다.

제8조 (포인트)
1. 포인트는 출석·미션·친구초대 등 서비스 활동에 따라 지급됩니다.
2. 포인트 1P의 가치는 1원이며, 포인트 10P는 티켓 1장으로 전환할 수 있습니다. 티켓은 포인트로 전환할 수 없습니다.
3. 포인트는 현금으로 환급되지 않으며, 타인에게 양도할 수 없습니다.
4. 포인트의 사용 및 전환은 카카오 계정 연동 후 가능합니다.

제9조 (보상의 확정 및 취소)
1. 경유 구매에 따른 리워드는 지급 즉시 &quot;적립 예정&quot; 상태가 되며, 일정 기간 경과 후 확정되어 사용할 수 있습니다. 확정까지의 기간은 서비스 내에 고지합니다.
2. 확정 전에 구매가 취소·환불된 경우 해당 리워드는 자동으로 취소되며, 이용자의 잔액에 영향을 주지 않습니다.
3. 확정 후 구매가 취소·환불된 경우 회사는 미사용 리워드를 환수할 수 있습니다. 구매에 기인하여 지급된 이벤트 티켓 역시 환수 대상에 포함됩니다.
4. 출석·선물 상자·미션 등 구매와 무관하게 지급된 보상은 제3항의 환수 대상에서 제외됩니다.

제10조 (추첨 및 경품)
1. 회사는 이벤트 티켓을 사용한 추첨을 정기적으로 진행하며, 추첨 주기·응모 한도·경품은 서비스 내에 고지합니다.
2. 당첨자 발표 및 경품 지급 방법은 각 회차별로 고지합니다.
3. 당첨자가 정해진 기간 내에 수령 정보를 제공하지 않는 경우 당첨이 취소될 수 있습니다.
4. 부정한 방법으로 응모한 사실이 확인된 경우 당첨은 취소되며 경품은 환수됩니다.

제11조 (친구초대)
1. 친구초대 보상은 피초대자가 최초 경유 구매를 완료한 경우에 지급되며, 구체적인 지급 시기와 한도는 서비스 내에 고지합니다.
2. 해당 구매가 취소·환불된 경우 보상은 지급되지 않으며, 이미 지급된 경우 환수될 수 있습니다.

제12조 (금지행위 및 제재)
1. 이용자는 다음 행위를 하여서는 안 됩니다.
  가. 리워드를 부정하게 취득할 목적으로 구매 후 반복적으로 취소·환불하는 행위
  나. 다수의 계정을 생성하거나 타인의 정보를 도용하는 행위
  다. 자동화 프로그램·매크로 등을 사용하는 행위
  라. 허위 정보로 적립을 신청하는 행위
  마. 서비스의 정상적인 운영을 방해하는 행위
2. 회사는 제1항의 행위가 확인되거나 합리적으로 의심되는 경우 리워드 환수, 적립 제한, 서비스 이용 제한, 계정 정지 등의 조치를 할 수 있습니다.
3. 회사는 조치 전 이용자에게 사유를 통지하며, 이용자는 이에 대해 소명할 수 있습니다. 다만 긴급한 경우 선조치 후 통지할 수 있습니다.

제13조 (탈퇴 및 재가입)
1. 이용자는 언제든지 서비스 내 메뉴를 통해 탈퇴할 수 있습니다.
2. 탈퇴 시 보유한 티켓·포인트는 모두 소멸하며, 복구되지 않습니다.
3. 탈퇴 후 재가입에 제한을 두지 않습니다. 다만 제12조에 해당하는 행위가 확인된 계정에 대해서는 일정 기간 재가입을 제한할 수 있습니다.

제14조 (지식재산권)
1. 서비스 및 서비스 내 콘텐츠에 대한 저작권 등 지식재산권은 회사에 귀속됩니다.
2. 이용자는 서비스를 이용하여 얻은 정보를 회사의 사전 승낙 없이 복제·전송·출판·배포 등 영리 목적으로 이용할 수 없습니다.

제15조 (서비스의 변경·중단)
1. 회사는 운영상·기술상 필요에 따라 서비스의 전부 또는 일부를 변경·중단할 수 있습니다.
2. 서비스를 종료하는 경우 회사는 30일 전에 공지하고, 이용자가 보유한 리워드의 처리 방법을 함께 안내합니다.

제16조 (면책)
1. 회사는 천재지변, 제휴 쇼핑몰의 정책 변경, 통신 장애 등 회사의 귀책사유가 없는 사유로 발생한 손해에 대하여 책임을 지지 않습니다.
2. 회사는 제휴 쇼핑몰에서 판매하는 상품의 하자, 배송, 환불 등에 대하여 책임을 지지 않으며, 해당 사항은 각 쇼핑몰의 정책에 따릅니다.
3. 회사는 이용자가 서비스를 경유하지 않고 구매하여 발생한 적립 누락에 대하여 책임을 지지 않습니다.

제17조 (분쟁의 해결)
본 약관과 관련한 분쟁은 대한민국 법령에 따르며, 관할 법원은 민사소송법에 따릅니다.

부칙
본 약관은 2026년 11월 1일부터 시행합니다.</template>
